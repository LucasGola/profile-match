name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, tipos e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci dispara o postinstall (prisma generate), gerando o client
      # antes do typecheck/build.
      - name: Instalar dependências
        run: npm ci

      - name: Checar formatação (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Checar tipos (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build
